<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>u2b 下载器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 380px;
      background: #14161b;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      font-size: 13px;
    }
    .header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.06);
      padding: 3px;
      border-radius: 8px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #fff;
      font-weight: 500;
    }
    .panel {
      padding: 14px 16px;
      max-height: 460px;
      overflow-y: auto;
    }
    .hidden { display: none; }
    .quick-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .q-btn {
      background: rgba(37, 99, 235, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #93c5fd;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .q-btn:hover { background: rgba(37, 99, 235, 0.3); }
    .q-btn.mp3 {
      background: rgba(168, 85, 247, 0.18);
      border-color: rgba(168, 85, 247, 0.35);
      color: #d8b4fe;
    }
    .q-btn.mp3:hover { background: rgba(168, 85, 247, 0.3); }
    .section-title {
      font-size: 11px;
      color: #9ca3af;
      margin: 8px 0 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .root-box {
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .root-info {
      overflow: hidden;
      flex: 1;
    }
    .root-caption {
      font-size: 10px;
      color: #93c5fd;
      margin-bottom: 2px;
    }
    .root-path {
      font-size: 11px;
      color: #e5e7eb;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .inline-input-row {
      display: none;
      gap: 6px;
      margin-bottom: 8px;
    }
    .inline-input-row.show {
      display: flex;
    }
    .inline-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px;
      padding: 5px 8px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .task-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 11px;
      color: #9ca3af;
    }
    .task-name {
      font-weight: 500;
      color: #f9fafb;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .bar-bg {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .bar-fill {
      height: 100%;
      background: #3b82f6;
    }
    .btn-group {
      display: flex;
      gap: 4px;
    }
    .link-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.18);
      color: #d1d5db;
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .link-btn:hover { background: rgba(255,255,255,0.1); }
    .link-btn.primary {
      border-color: rgba(59, 130, 246, 0.45);
      color: #93c5fd;
    }
    .dir-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      gap: 8px;
    }
    .dir-info {
      overflow: hidden;
      flex: 1;
    }
    .dir-label { font-weight: 500; color: #e5e7eb; }
    .dir-path {
      font-size: 11px;
      color: #9ca3af;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty {
      text-align: center;
      color: #6b7280;
      padding: 24px 0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">📥 u2b 下载助手</div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-tasks">任务列表</button>
      <button class="tab-btn" id="tab-dirs">目录管理</button>
    </div>
  </div>

  <div class="panel" id="panel-tasks">
    <div class="quick-bar">
      <button class="q-btn" id="btn-dl-video">⚡ 下载当前页视频</button>
      <button class="q-btn mp3" id="btn-dl-mp3">🎵 下载当前页 MP3</button>
    </div>
    <div class="section-title">最近下载任务</div>
    <div id="tasks-container"></div>
  </div>

  <div class="panel hidden" id="panel-dirs">
    <div class="section-title">
      <span>🎬 视频分类目录（自动扫描根目录子文件夹）</span>
      <div class="btn-group">
        <button class="link-btn primary" id="new-video-cat">+ 新建分类</button>
        <button class="link-btn" id="add-video-dir">+ 外部目录</button>
      </div>
    </div>
    <div class="root-box">
      <div class="root-info">
        <div class="root-caption">视频库扫描根目录</div>
        <div class="root-path" id="video-root-path">加载中...</div>
      </div>
      <button class="link-btn" id="change-video-root">📁 更换根目录</button>
    </div>
    <div class="inline-input-row" id="video-cat-row">
      <input type="text" class="inline-input" id="video-cat-input" placeholder="输入新视频分类名（如：AI教程）" />
      <button class="link-btn primary" id="video-cat-submit">创建</button>
    </div>
    <div id="video-dirs-list"></div>

    <div class="section-title" style="margin-top: 16px;">
      <span>🎵 MP3 音乐分类目录（自动扫描根目录子文件夹）</span>
      <div class="btn-group">
        <button class="link-btn primary" id="new-audio-cat">+ 新建分类</button>
        <button class="link-btn" id="add-audio-dir">+ 外部目录</button>
      </div>
    </div>
    <div class="root-box">
      <div class="root-info">
        <div class="root-caption">音乐库扫描根目录</div>
        <div class="root-path" id="audio-root-path">加载中...</div>
      </div>
      <button class="link-btn" id="change-audio-root">📁 更换根目录</button>
    </div>
    <div class="inline-input-row" id="audio-cat-row">
      <input type="text" class="inline-input" id="audio-cat-input" placeholder="输入新音乐分类名（如：刀郎）" />
      <button class="link-btn primary" id="audio-cat-submit">创建</button>
    </div>
    <div id="audio-dirs-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
